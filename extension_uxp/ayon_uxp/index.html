<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">

  <style>
    html, body, .wrap {
      display: flex;
      flex-direction: column;
      background: #424242;
      max-height: fit-content;
    }

    .wrap {
      height: max-content;
    }

    p {
      color: #b0b0b0;
      min-height: 1.75rem;
      margin-left: 0.5rem;
      margin-top: 0.2rem;
      font-size: 0.4rem
    }

    html {
      margin: 0;
      overflow-y: clip;
      font-family: Arial, sans-serif;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      min-height: 1.75rem;
      width: 10rem;
      margin: 0.2rem 0 0.2rem 0.4rem;
      padding-left: 0.65rem;
      background-color: rgb(39, 63, 70);
      color: #e0e0e0;
      border: 0.075rem;
      border-radius: 0.15rem;
      border-style: solid;
      border-color: #277189;
      cursor: pointer;
      font-size: 0.75rem;
      font-weight: bold;
      user-select: none;
      transition: background-color 0.6s ease;
    }

    .btn:hover  { background-color: #1e607e; }
    .btn:active { background-color: #3498DB; }

  </style>
</head>

<body>
  <div class="wrap">
    <div class="btn" id="workfiles-button">Workfiles...</div>
    <div class="btn" id="loader-button">Load...</div>
    <div class="btn" id="publish-button">Publish...</div>
    <div class="btn" id="sceneinventory-button">Manage...</div>
    <div class="btn" id="experimental-button">Experimental Tools...</div>
    <p>Plugin converted by Sas van Gulik<br><b>@ Studio Submarine</b></p>
  </div>

  <script src="./main.js"></script>
</body>
</html>
